name: Build and Tests for JDK 17

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # allows SonarCloud to decorate PRs with analysis results
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: 17
          cache: maven

      # required so the "sonar:sonar" prefix resolves during the integration
      # tests (maven-failsafe-plugin), which analyze a test project via Sonar
      - name: Configure Maven for Sonar
        run: |
          mkdir -p ~/.m2
          echo "<settings><pluginGroups><pluginGroup>org.sonarsource.scanner.maven</pluginGroup></pluginGroups></settings>" > ~/.m2/settings.xml

      # see build.yml: runner Maven 3.10+ breaks maven-git-versioning-extension
      - name: Use Maven wrapper distribution as "mvn"
        run: |
          ./mvnw -B -v
          MVN_BIN="$(find "$HOME/.m2/wrapper/dists" -type f -path '*/bin/mvn' | head -n 1)"
          test -n "$MVN_BIN"
          dirname "$MVN_BIN" >> "$GITHUB_PATH"

      - name: Check Maven version
        run: mvn -v

      - name: Verify
        run: ./mvnw -e -B verify -Dtest-it.sonarqube.version=10.2.0.77647
